spring.application.name=backend
# =========================================================
# Clutch API - application.properties
# 위치: src/main/resources/application.properties
# 값은 프로젝트 루트의 .env에서 읽고, 없으면 : 뒤의 기본값 사용
# =========================================================

# ---------- .env 불러오기 ----------
spring.config.import=optional:file:.env[.properties]

# ---------- Application ----------
server.port=${SERVER_PORT:8080}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# 에러 응답에 스택트레이스 노출 금지 (공통 에러 포맷은 직접 구현)
server.error.include-stacktrace=never
server.error.include-message=never

# 그레이스풀 셧다운: 처리 중인 요청과 영상 작업이 끝날 시간을 줌
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# ---------- Docker Compose Support (로컬 개발) ----------
# 앱 실행 시 compose.yaml 컨테이너를 띄우고, 앱 종료 시 컨테이너는 유지
spring.docker.compose.lifecycle-management=start-only
spring.docker.compose.file=compose.yaml

# ---------- PostgreSQL ----------
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:clutch}
spring.datasource.username=${POSTGRES_USER:clutch}
spring.datasource.password=${POSTGRES_PASSWORD:clutch}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=3000

# ---------- JPA ----------
# 스키마는 Flyway가 관리하고, JPA는 엔티티와 테이블이 맞는지만 검증
spring.jpa.hibernate.ddl-auto=validate
# 트랜잭션 밖 지연 로딩 금지: N+1을 서비스 계층에서 드러나게 함
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul
spring.jpa.properties.hibernate.default_batch_fetch_size=100
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ---------- Flyway ----------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# 시드 데이터(게임 목록, 테스트 클립 등)는 로컬에서만
spring.flyway.placeholders.env=${SPRING_PROFILES_ACTIVE:local}

# ---------- Redis ----------
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
# 장애 시 오래 매달리지 않고 빠르게 실패 (6.2.1 fail-closed 정책)
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s

# ---------- Logging ----------
logging.level.root=INFO
logging.level.com.clutch=DEBUG
# 실행되는 SQL과 바인딩 값 확인 (N+1 관찰용, 부하 테스트 때는 끄기)
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ---------- API 문서 (springdoc) ----------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.default-produces-media-type=application/json

# ---------- Web ----------
clutch.web.cors-allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ---------- JWT ----------
clutch.jwt.secret=${JWT_SECRET}
clutch.jwt.issuer=${JWT_ISSUER:clutch}
clutch.jwt.access-ttl=${JWT_ACCESS_TTL:PT30M}
clutch.jwt.refresh-ttl=${JWT_REFRESH_TTL:P14D}

# ---------- Object Storage (S3 호환) ----------
clutch.storage.endpoint=${STORAGE_ENDPOINT:http://localhost:9000}
clutch.storage.region=${STORAGE_REGION:us-east-1}
clutch.storage.access-key=${STORAGE_ACCESS_KEY}
clutch.storage.secret-key=${STORAGE_SECRET_KEY}
clutch.storage.path-style=${STORAGE_PATH_STYLE:true}
clutch.storage.raw-bucket=${STORAGE_RAW_BUCKET:clutch-raw}
clutch.storage.media-bucket=${STORAGE_MEDIA_BUCKET:clutch-media}
clutch.storage.presign-ttl=${STORAGE_PRESIGN_TTL:PT15M}
clutch.storage.media-public-base-url=${STORAGE_MEDIA_PUBLIC_BASE_URL:http://localhost:9000/clutch-media}

# ---------- Video Processing ----------
clutch.video.ffmpeg-path=${FFMPEG_PATH:ffmpeg}
clutch.video.ffprobe-path=${FFPROBE_PATH:ffprobe}
clutch.video.worker-concurrency=${TRANSCODE_WORKER_CONCURRENCY:1}
clutch.video.output-max-height=1080

# ---------- 정책 값 (명세 기반, 하드코딩 금지) ----------
clutch.policy.zone-id=Asia/Seoul

# 업로드 (2.1.1, 정책 1)
clutch.policy.upload.max-file-size=2GB
clutch.policy.upload.max-duration=PT60S
clutch.policy.upload.allowed-extensions=mp4,mov,webm
clutch.policy.upload.daily-limit=20
clutch.policy.upload.max-concurrent-jobs=2
clutch.policy.upload.auto-retry=2
clutch.policy.upload.manual-retry=3

# 댓글 (4.2.1, 정책 5)
clutch.policy.comment.max-length=500
clutch.policy.comment.per-minute-limit=10
clutch.policy.comment.duplicate-window=PT10M

# 조회수 (4.3.1, 정책 2)
clutch.policy.view.min-watch=PT3S
clutch.policy.view.short-clip-threshold=PT6S
clutch.policy.view.short-clip-ratio=0.5
clutch.policy.view.dedup-ttl=PT24H
clutch.policy.view.ip-hash-salt=${VIEW_IP_HASH_SALT}

# 랭킹 (5.1.1, 정책 2)
clutch.policy.ranking.view-weight=1
clutch.policy.ranking.like-weight=4
clutch.policy.ranking.comment-weight=12
clutch.policy.ranking.decay-rate=0.08
clutch.policy.ranking.refresh-interval=PT5M

# Redis 임시 집계 -> PostgreSQL 반영 주기 (정책 2)
clutch.policy.flush-interval=PT5M

# 신고 (7.1.1, 정책 4)
clutch.policy.report.auto-hide-threshold=5
clutch.policy.report.duplicate-window=PT24H